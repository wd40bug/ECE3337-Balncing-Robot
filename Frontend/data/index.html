<!DOCTYPE html>
<html>

<head>
  <meta name=\viewport\ content=\width=device-width, initial-scale=1\>
  <link rel="stylesheet" href="uPlot.min.css">
  <script src="uPlot.iife.min.js"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 15px 25px;
      text-decoration: none;
      font-size: 24px;
      margin: 10px;
      display: inline-block;
      border-radius: 5px;
    }

    button:active {
      background-color: #e66ed0;
    }

    #dircntrl {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
    }

    .PID {
      display: grid;
      grid-template-columns: 1fr 3fr 1fr 3fr 1fr 3fr 2fr 3fr 1fr;
      margin-bottom: 25px;
      padding: 10px;
      background-color: lightgray;
    }

    #up {
      grid-column: 2;
      grid-row: 1;
    }

    #left {
      grid-column: 1;
      grid-row: 2;
    }

    #right {
      grid-column: 3;
      grid-row: 2;
    }

    #down {
      grid-column: 2;
      grid-row: 3;
    }

    .off {
      background-color: grey;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

  </style>

  <script>
    function pressButton(name) {
      console.log("/press/" + name);
      fetch("/press/" + name).catch(error => console.error('Error reaching ESP32:', error));
    }
    function unpressButton(name) {
      console.log("/unpress/" + name);
      fetch("/unpress/" + name).catch(error => console.error('Error reaching ESP32:', error));
    }

    function On() {
      fetch("/on").catch(error => console.error('Error reaching ESP32:', error));
    }

    function Off() {
      fetch("/off").catch(error => console.error('Error reaching ESP32:', error));
    }

    function simpleValueFunction(name, id) {
      return function () {
        console.log(name);
        const input = document.getElementById(id);
        fetch("/" + name, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
          },
          body: new URLSearchParams({value: input.value}),
        })
      };
    }

    const sendSetValue = simpleValueFunction("setValue", "setValue");
    const sendMinDuty = simpleValueFunction("minDuty", "minDuty");

    function setPID() {
      const pitchP = document.getElementById("PitchP");
      const pitchI = document.getElementById("PitchI");
      const pitchD = document.getElementById("PitchD");
      const pitchS = document.getElementById("PitchS");

      fetch("/setPID", {
        method: "POST",
        headers: {
          "Content-Type": "application/json" // <-- Add this!
        },
        body: JSON.stringify({
          "pitch": {
            "P": pitchP.value,
            "I": pitchI.value,
            "D": pitchD.value,
            "S": pitchS.value
          },
          "motor": {
            "P": 0,
            "I": 0,
            "D": 0,
            "S": 0
          }
        })
      }).catch(error => console.error('Error reaching ESP32:', error));
    }
  </script>
</head>

<body>
  <h1>Balancing Robot Control</h1>
  <button id="toggleBtnOn" onclick="On()">ON</button>
  <button id="toggleBtnOff" onclick="Off()" class="off">OFF</button>
    <div id="dircntrl">
    <button id="up" onpointerdown="pressButton('up')" onpointerup="unpressButton('up')">UP</button>
    <button id="left" onpointerdown="pressButton('left')" onpointerup="unpressButton('left')">LEFT</button>
    <button id="right" onpointerdown="pressButton('right')" onpointerup="unpressButton('right')">RIGHT</button>
    <button id="down" onpointerdown="pressButton('down')" onpointerup="unpressButton('down')">DOWN</button>
  </div>
  <div class="row">
    <p>SetValue</p>
    <input type="number" min="-10" max="10" id="setValue" value="0" step="any">
    <button onclick="sendSetValue()">SEND</button>
  </div>
  <div class="row">
    <p>MinDuty</p>
    <input type="number" value="20" min="0" max="127" id="minDuty">
    <button onclick="sendMinDuty()">SEND</button>
  </div>
  <div class="PID">
    <p>P</p>
    <input type="number" min="0" max="4095" id="PitchP" value="0">
    <p>I</p>
    <input type="number" min="0" max="4095" id="PitchI" value="0">
    <p>D</p>
    <input type="number" min="0" max="4095" id="PitchD" value="0">
    <p>Shift</p>
    <input type="number" min="0" max="4095" id="PitchS" value="4">
    <button onclick="setPID()">SEND</button>
  </div>
</body>

</html>
